spring:
  application:
    name: libaryAPI
  datasource:
    url: jdbc:postgresql://localhost:5432/libary
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
      #ddl-auto: update
    properties:
      hibernate.format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
logging:
  file:
    name: app.log
  level:
    root: warn
    io:
      github:
        daviaarrudaofc: trace
    org:
      springframework:
        web: debug
        security: trace
    #trace -- ordem de abrangência
    #debug
    #info
    #warn
    #erro

springdoc:
  override-with-generic-response: false
