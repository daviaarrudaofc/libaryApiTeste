spring:
  application:
    name: libaryAPI
#  profiles:
#    active: production
# SPRING_PROFILES_ACTIVE=(o ambiente que vc quer)

  datasource:
    url: jdbc:postgresql://localhost:5432/libary
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
      #ddl-auto: update
    properties:
      hibernate.format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
  output:
    ansi:
      enabled: always
logging:
  pattern:
    console: '%clr(%d{dd-MM-yyyy HH:mm:ss}){faint} %clr(%5p) %clr([%t]){faint} %clr(%-40.40logger){cyan} %clr(:){yellow} %m%n'
  file:
    name: app.log
  level:
    root: warn
    io:
      github:
        daviaarrudaofc: trace
    org:
      springframework:
        web: debug
        security: trace
    #trace -- ordem de abrangência
    #debug
    #info
    #warn
    #erro

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: '*'



springdoc:
  override-with-generic-response: false


# production
---
spring:
  config:
    activate:
      on-profile: production
  jpa:
    show-sql: false

# homologacao
---
spring:
  config:
    activate:
      on-profile: homologacao
  jpa:
    show-sql: false
  datasource:
    url: jdbc:postgresql://localhost:5432/libary


